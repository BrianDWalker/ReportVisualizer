name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and generate p2 repository
        run: ./scripts/build-update-site.sh
      - name: Verify plugin and feature outputs
        run: |
          test -n "$(find plugins/com.brianwalker.dbeaver.resultsvisualizer/target -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$(find features/com.brianwalker.dbeaver.resultsvisualizer.feature/target -maxdepth 1 -name '*.jar' -print -quit)"
      - name: Upload clean p2 repository
        uses: actions/upload-artifact@v7
        with:
          name: results-visualizer-p2
          path: releng/com.brianwalker.dbeaver.resultsvisualizer.repository/target/repository/
